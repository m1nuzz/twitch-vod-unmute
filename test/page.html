<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fake twitch vod</title>
    <style>
      body {
        margin: 0;
        background: #0e0e10;
        color: #fff;
        font-family: sans-serif;
      }
      #player-root {
        position: relative;
        width: 640px;
        height: 360px;
        background: #000;
      }
      #player-root video {
        width: 100%;
        height: 100%;
      }
      .controls--div {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.6);
        padding: 0 8px;
      }
      [data-a-target="player-seekbar"] {
        position: absolute;
        bottom: 36px;
        left: 0;
        right: 0;
        height: 6px;
        background: #444;
      }
      .seekbar-bar {
        height: 100%;
        width: 100%;
      }
      .share-wrap {
        margin-left: auto;
      }
      .fake-share {
        height: 26px;
        padding: 0 12px;
        border: 0;
        border-radius: 4px;
        background: #2f2f35;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #log {
        padding: 12px;
        font: 12px/1.5 monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="player-root">
      <div data-a-target="video-player">
        <video id="player" src="/vod.mp4" playsinline></video>
      </div>
      <div data-a-target="player-seekbar"><div class="seekbar-bar"></div></div>
      <div class="controls--div">
        <span id="clock">0.00</span>
        <input type="range" class="tw-range" min="0" max="1" step="0.01" value="0.5" />
        <button data-a-target="player-settings-button">settings</button>
        <div class="share-wrap">
          <button aria-label="Поделиться" class="fake-share">
            <span class="fake-share-icon tw-core-button-icon"
              ><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 6v10h-2V6L9.5 7.5 8 6l4-4 4 4-1.5 1.5L13 6Z"></path>
                <path d="M6 8h3v2H6v10h12V10h-3V8h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z"></path></svg></span
            ><span data-a-target="tw-core-button-label-text">Поделиться</span>
          </button>
        </div>
      </div>
    </div>
    <div id="log"></div>
    <script>
      const log = (m) => (document.getElementById("log").textContent += m + "\n");
      window.__clock = () => document.getElementById("clock").textContent;

      // The VOD's own (already silenced) audio is muted server-side; mimic a player that
      // pulls named segments so the extension can observe the "-muted" convention.
      window.requestSegments = (n) =>
        fetch(`/videos/2926037201/${n}-muted.ts`)
          .then((r) => r.text())
          .then((t) => {
            log(`segment ${n}-muted.ts -> ${t}`);
            return t;
          });
      fetch("/videos/2926037201/storyboards/2926037201-info.json")
        .then((r) => r.text())
        .then((t) => log("storyboard " + t.slice(0, 40)));
      fetch("/videos/2926037201/793-muted.ts").then((r) => r.text());

      setInterval(() => {
        const v = document.getElementById("player");
        document.getElementById("clock").textContent = v.currentTime.toFixed(2);
      }, 100);
    </script>
  </body>
</html>
