name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          node -e "const v=require('./extension/manifest.json').version; const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if (tag!==v) { console.error('tag '+tag+' does not match manifest version '+v); process.exit(1); }"
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - name: Ensure ffprobe
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm test
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
